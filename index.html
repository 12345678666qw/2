<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, maximum-scale=1.0, user-scalable=no">
<title>手势交互粒子系统</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    background: #000;
    overflow: hidden;
    font-family: 'Microsoft YaHei', 'PingFang SC', sans-serif;
    user-select: none;
    -webkit-user-select: none;
    cursor: default;
  }
  #mainCanvas {
    position: fixed;
    top: 0; left: 0;
    width: 100%; height: 100%;
    z-index: 1;
  }
  #video {
    position: fixed;
    top: 0; left: 0;
    width: 1px; height: 1px;
    opacity: 0.01;
    pointer-events: none;
    z-index: -1;
  }
  #previewContainer {
    position: fixed;
    bottom: 20px; right: 20px;
    width: 260px; height: 195px;
    border-radius: 12px;
    overflow: hidden;
    z-index: 10;
    border: 2px solid rgba(0, 255, 200, 0.4);
    box-shadow: 0 0 20px rgba(0, 255, 200, 0.2), 0 0 60px rgba(0, 200, 255, 0.1);
    background: rgba(0, 0, 0, 0.6);
    transition: opacity 0.5s;
  }
  #previewCanvas {
    width: 100%; height: 100%;
    display: block;
    transform: scaleX(-1);
  }
  #uiOverlay {
    position: fixed;
    top: 0; left: 0;
    width: 100%; height: 100%;
    pointer-events: none;
    z-index: 5;
  }
  #gestureLabel {
    position: absolute;
    top: 30px; left: 30px;
    font-size: 28px;
    font-weight: bold;
    color: #fff;
    text-shadow: 0 0 20px rgba(0, 255, 200, 0.8), 0 0 40px rgba(0, 200, 255, 0.5);
    transition: all 0.3s ease;
    letter-spacing: 2px;
  }
  #scaleIndicator {
    position: absolute;
    top: 30px; right: 30px;
    font-size: 14px;
    color: rgba(255, 255, 255, 0.7);
    background: rgba(0, 0, 0, 0.4);
    padding: 8px 16px;
    border-radius: 20px;
    border: 1px solid rgba(0, 255, 200, 0.2);
    text-shadow: 0 0 8px rgba(0, 255, 200, 0.5);
    letter-spacing: 1px;
    transition: all 0.3s ease;
  }
  #guideBox {
    position: absolute;
    bottom: 50%; left: 50%;
    transform: translate(-50%, 50%);
    background: rgba(0, 0, 0, 0.7);
    border: 1px solid rgba(0, 255, 200, 0.3);
    border-radius: 16px;
    padding: 24px 32px;
    color: rgba(255, 255, 255, 0.85);
    font-size: 14px;
    line-height: 2;
    box-shadow: 0 0 40px rgba(0, 255, 200, 0.1);
    transition: opacity 0.8s ease;
    pointer-events: auto;
    text-align: center;
    max-width: 380px;
  }
  #guideBox .title {
    font-size: 18px;
    font-weight: bold;
    margin-bottom: 10px;
    color: #0ff;
    text-shadow: 0 0 10px rgba(0, 255, 255, 0.6);
  }
  #guideBox .item { margin: 4px 0; }
  #guideBox .gesture-icon { font-size: 18px; margin-right: 4px; }
  #guideBox button {
    margin-top: 14px;
    padding: 8px 28px;
    border: 1px solid rgba(0, 255, 200, 0.5);
    border-radius: 20px;
    background: rgba(0, 255, 200, 0.1);
    color: #0ff;
    font-size: 14px;
    cursor: pointer;
    pointer-events: auto;
    transition: all 0.3s;
    font-family: inherit;
  }
  #guideBox button:hover {
    background: rgba(0, 255, 200, 0.25);
    box-shadow: 0 0 20px rgba(0, 255, 200, 0.3);
  }
  #loadingOverlay {
    position: fixed;
    top: 0; left: 0; width: 100%; height: 100%;
    background: #000;
    z-index: 100;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    transition: opacity 0.5s ease;
  }
  #loadingOverlay .spinner {
    width: 50px; height: 50px;
    border: 3px solid rgba(0, 255, 200, 0.2);
    border-top-color: #0ff;
    border-radius: 50%;
    animation: spin 1s linear infinite;
    margin-bottom: 16px;
  }
  @keyframes spin { to { transform: rotate(360deg); } }
  #loadingOverlay .text {
    color: rgba(255,255,255,0.7);
    font-size: 14px;
    letter-spacing: 2px;
  }
  @media (max-width: 768px) {
    #previewContainer {
      top: 10px; right: 10px; bottom: auto; left: auto;
      width: 130px; height: 98px;
      border-radius: 8px;
      border-width: 1px;
    }
    #gestureLabel {
      top: 10px; left: 12px;
      font-size: 16px;
      letter-spacing: 1px;
    }
    #scaleIndicator {
      top: 115px; right: 12px;
      font-size: 11px;
      padding: 4px 10px;
    }
    #guideBox {
      padding: 16px 20px;
      font-size: 12px;
      line-height: 1.7;
      max-width: 280px;
    }
    #guideBox .title { font-size: 15px; }
    #loadingOverlay .text { font-size: 12px; }
    #loadingOverlay .spinner { width: 36px; height: 36px; }
    #startBtn { font-size: 14px; padding: 10px 28px; }
    body { touch-action: none; }
  }
</style>
</head>
<body>

<canvas id="mainCanvas"></canvas>
<video id="video" playsinline webkit-playsinline autoplay muted loop></video>
<div id="previewContainer">
  <canvas id="previewCanvas" width="320" height="240"></canvas>
</div>
<div id="uiOverlay">
  <div id="gestureLabel">等待手势…</div>
  <div id="scaleIndicator">缩放: 100%</div>
  <div id="guideBox">
    <div class="title">手势交互说明</div>
    <div class="item"><span class="gesture-icon">🖐</span> 张合手掌 — 粒子缩放 & 移动</div>
    <div class="item"><span class="gesture-icon">✌️</span> 对勾/剪刀手 — 显示"爱你"</div>
    <div class="item"><span class="gesture-icon">👍</span> 点赞 — 显示"谢谢！"</div>
    <div class="item"><span class="gesture-icon">✊</span> 握拳→张开×2 — 触发祝福文字</div>
    <div class="item"><span class="gesture-icon">👌</span> OK手势 — 重置粒子</div>
    <div class="item"><span class="gesture-icon">🔄</span> 快速翻手 — 切换主题色</div>
    <button id="guideCloseBtn">开始体验</button>
  </div>
</div>
<div id="loadingOverlay">
  <div class="spinner"></div>
  <div class="text">加载手势识别模型…</div>
  <button id="startBtn" style="display:none;margin-top:18px;padding:12px 36px;border:2px solid rgba(0,255,200,0.6);border-radius:24px;background:rgba(0,255,200,0.12);color:#0ff;font-size:16px;font-family:inherit;cursor:pointer;letter-spacing:2px;">点击开始</button>
</div>

<script src="https://cdn.jsdelivr.net/npm/@mediapipe/camera_utils/camera_utils.js" crossorigin="anonymous"></script>
<script src="https://cdn.jsdelivr.net/npm/@mediapipe/hands/hands.js" crossorigin="anonymous"></script>
<script src="https://cdn.jsdelivr.net/npm/@mediapipe/drawing_utils/drawing_utils.js" crossorigin="anonymous"></script>

<script>
(function() {
  // ─────────────────────────────────────
  // DOM refs
  // ─────────────────────────────────────
  const mainCanvas = document.getElementById('mainCanvas');
  const ctx = mainCanvas.getContext('2d');
  const videoEl = document.getElementById('video');
  const previewCanvas = document.getElementById('previewCanvas');
  const previewCtx = previewCanvas.getContext('2d');
  const gestureLabel = document.getElementById('gestureLabel');
  const scaleIndicator = document.getElementById('scaleIndicator');
  const guideBox = document.getElementById('guideBox');
  const loadingOverlay = document.getElementById('loadingOverlay');
  const guideCloseBtn = document.getElementById('guideCloseBtn');
  const previewContainer = document.getElementById('previewContainer');

  // ─────────────────────────────────────
  // Configuration
  // ─────────────────────────────────────
  const PARTICLE_COUNT = 400;
  let isMobile = false;
  let effectiveParticleCount = PARTICLE_COUNT;
  let effectiveStarCount = 200;
  let glowScale = 1;
  let shadowScale = 1;

  function updateMobileConfig(w) {
    isMobile = w < 768;
    effectiveParticleCount = isMobile ? 200 : PARTICLE_COUNT;
    effectiveStarCount = isMobile ? 80 : 200;
    glowScale = isMobile ? 0.6 : 1;
    shadowScale = isMobile ? 0.55 : 1;
  }
  const SMOOTHING_FRAMES = 5;
  const GESTURE_DEBOUNCE_MS = 200;
  const FIST_HOLD_MS = 300;
  const SEQUENCE_TIMEOUT_MS = 5000;
  const TRANSITION_WINDOW_MS = 500;
  const TEXT_DISPLAY_MS = 3000;

  // ─────────────────────────────────────
  // State
  // ─────────────────────────────────────
  let W, H;
  const state = {
    // Hand tracking
    landmarksRaw: null,
    landmarksHistory: [],
    landmarksSmoothed: null,
    handedness: null,
    openness: 0,
    opennessSmoothed: 0,
    handCenterX: 0.5,
    handCenterY: 0.5,
    handCenterSmoothedX: 0.5,
    handCenterSmoothedY: 0.5,
    handDetected: false,

    // Gesture detection
    currentGesture: 'none',
    gestureDebounceEnd: 0,
    gestureStableFrames: 0,

    // Fist detection
    fistStartTime: 0,
    fistConfirmed: false,
    fistConfirmedTime: 0,

    // Fist→Open sequence
    fistOpenCounter: 0,
    fistOpenLastTime: 0,
    sequenceActive: false,

    // Finger states
    fingersExtended: [false, false, false, false, false],

    // Flip detection
    flipMetricHistory: [],
    flipCooldown: 0,

    // Color theme
    themeIndex: 0,

    // Particle system
    particles: [],
    globalScale: 1,
    targetScale: 1,
    globalOffsetX: 0,
    targetOffsetX: 0,
    globalOffsetY: 0,
    targetOffsetY: 0,
    textMode: null,          // null | 'aini' | 'xiexie' | 'zhuni'
    textTimer: 0,
    textTransition: 0,       // 0→1 during text enter, 1→0 during text exit

    // Time
    lastTime: performance.now(),
  };

  // ─────────────────────────────────────
  // Resize
  // ─────────────────────────────────────
  function resize() {
    W = window.innerWidth;
    H = window.innerHeight;
    updateMobileConfig(W);
    const dpr = Math.min(window.devicePixelRatio || 1, 2);
    mainCanvas.width = Math.floor(W * dpr);
    mainCanvas.height = Math.floor(H * dpr);
    mainCanvas.style.width = W + 'px';
    mainCanvas.style.height = H + 'px';
    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
  }
  let resizeDebounce = null;
  function handleResize() {
    if (resizeDebounce) clearTimeout(resizeDebounce);
    resizeDebounce = setTimeout(() => {
      const wasMobile = isMobile;
      resize();
      if (isMobile !== wasMobile) {
        state.particles = createParticles();
      }
    }, 300);
  }
  window.addEventListener('resize', handleResize);
  window.addEventListener('orientationchange', handleResize);
  resize();

  // ─────────────────────────────────────
  // Particle initialization
  // ─────────────────────────────────────
  function createParticles() {
    const particles = [];
    const cx = W / 2, cy = H / 2;
    const maxR = Math.min(W, H) * 0.42;
    for (let i = 0; i < effectiveParticleCount; i++) {
      const angle = Math.random() * Math.PI * 2;
      const radius = Math.pow(Math.random(), 0.5) * maxR;
      const bx = cx + Math.cos(angle) * radius;
      const by = cy + Math.sin(angle) * radius;
      const hueOff = (Math.random() - 0.5) * 80;
      particles.push({
        baseX: bx,
        baseY: by,
        x: bx,
        y: by,
        vx: 0, vy: 0,
        tx: bx, ty: by,
        size: 1.2 + Math.random() * 3.5,
        hueOffset: hueOff,
        saturation: 0.65 + Math.random() * 0.35,
        lightness: 0.45 + Math.random() * 0.35,
        alpha: 0.55 + Math.random() * 0.45,
        phase: Math.random() * Math.PI * 2,
        freq: 0.2 + Math.random() * 0.8,
        amp: 5 + Math.random() * 40,
        glowSize: 2 + Math.random() * 6,
      });
    }
    return particles;
  }

  state.particles = createParticles();

  // ─────────────────────────────────────
  // Utility functions
  // ─────────────────────────────────────
  function lerp(a, b, t) { return a + (b - a) * t; }
  function clamp(v, lo, hi) { return Math.max(lo, Math.min(hi, v)); }
  function dist2d(x1, y1, x2, y2) {
    const dx = x1 - x2, dy = y1 - y2;
    return Math.sqrt(dx * dx + dy * dy);
  }
  function dist3d(l1, l2) {
    const dx = l1.x - l2.x, dy = l1.y - l2.y, dz = (l1.z || 0) - (l2.z || 0);
    return Math.sqrt(dx * dx + dy * dy + dz * dz);
  }

  // ─────────────────────────────────────
  // Color themes
  // ─────────────────────────────────────
  const THEMES = [
    { baseHue: 190, name: 'cyan' },
    { baseHue: 315, name: 'magenta' },
    { baseHue: 48, name: 'gold' },
  ];

  function getThemeColor(particle) {
    const theme = THEMES[state.themeIndex % THEMES.length];
    const h = ((theme.baseHue + particle.hueOffset) % 360 + 360) % 360;
    return {
      h,
      s: particle.saturation,
      l: particle.lightness,
      a: particle.alpha,
      hsl: `hsl(${h}, ${particle.saturation * 100}%, ${particle.lightness * 100}%)`,
      hsla: (a) => `hsla(${h}, ${particle.saturation * 100}%, ${particle.lightness * 100}%, ${a !== undefined ? a : particle.alpha})`,
    };
  }

  // ─────────────────────────────────────
  // Finger extension detection
  // ─────────────────────────────────────
  function isFingerExtended(lm, tipIdx, pipIdx, mcpIdx, wristIdx) {
    const tipDist = dist3d(lm[tipIdx], lm[wristIdx]);
    const pipDist = dist3d(lm[pipIdx], lm[wristIdx]);
    return tipDist > pipDist * 1.02; // more lenient
  }

  // Check if finger is curled (tip closer to wrist than pip)
  function isFingerCurled(lm, tipIdx, pipIdx, wristIdx) {
    const tipDist = dist3d(lm[tipIdx], lm[wristIdx]);
    const pipDist = dist3d(lm[pipIdx], lm[wristIdx]);
    return tipDist < pipDist * 0.98;
  }

  function isThumbUp(lm) {
    return lm[4].y < lm[3].y - 0.015 && lm[4].y < lm[2].y - 0.01;
  }

  function isThumbExtended(lm) {
    const tipWrist = dist3d(lm[4], lm[0]);
    const ipWrist = dist3d(lm[3], lm[0]);
    return tipWrist > ipWrist * 1.04;
  }

  // ─────────────────────────────────────
  // Openness calculation
  // ─────────────────────────────────────
  function calcOpenness(lm) {
    // Palm center: average of all MCP joints
    const mcpIndices = [2, 5, 9, 13, 17];
    let cx = 0, cy = 0, cz = 0;
    mcpIndices.forEach(i => { cx += lm[i].x; cy += lm[i].y; cz += (lm[i].z || 0); });
    cx /= 5; cy /= 5; cz /= 5;
    const palmCenter = { x: cx, y: cy, z: cz };

    // Tip indices
    const tipIndices = [4, 8, 12, 16, 20];
    let avgDist = 0;
    tipIndices.forEach(i => {
      avgDist += dist3d(lm[i], palmCenter);
    });
    avgDist /= 5;

    // Normalize: typical range is ~0.1 (fist) to ~0.45 (fully open)
    const minD = 0.08, maxD = 0.45;
    return clamp((avgDist - minD) / (maxD - minD), 0, 1);
  }

  // ─────────────────────────────────────
  // Gesture detection
  // ─────────────────────────────────────
  function detectGestures(lm) {
    if (!lm) return 'none';

    const fingers = [];
    fingers[0] = isThumbExtended(lm);
    fingers[1] = isFingerExtended(lm, 8, 6, 5, 0);
    fingers[2] = isFingerExtended(lm, 12, 10, 9, 0);
    fingers[3] = isFingerExtended(lm, 16, 14, 13, 0);
    fingers[4] = isFingerExtended(lm, 20, 18, 17, 0);

    // Curled check (more robust than !extended)
    const curled = [
      isFingerCurled(lm, 4, 3, 0),
      isFingerCurled(lm, 8, 6, 0),
      isFingerCurled(lm, 12, 10, 0),
      isFingerCurled(lm, 16, 14, 0),
      isFingerCurled(lm, 20, 18, 0),
    ];

    state.fingersExtended = fingers;
    const extCount = fingers.filter(Boolean).length;
    const curlCount = curled.filter(Boolean).length;
    const openness = state.opennessSmoothed;

    // ── V-sign (对勾/剪刀手): index+middle extended, ring+pinky curled ──
    const idxMidDist = dist3d(lm[8], lm[12]);
    const isVSign = (
      fingers[1] && fingers[2] &&        // index + middle extended
      curled[3] && curled[4] &&           // ring + pinky curled
      idxMidDist > 0.04                   // spread apart (relaxed threshold)
    );
    if (isVSign) return 'vsign';

    // ── Hand orientation: knuckle line angle ──
    // Horizontal (< 35°) = back of hand up → 握拳
    // Vertical (> 55°) = back of hand sideways → 点赞 candidate
    const dxKn = lm[17].x - lm[5].x;
    const dyKn = lm[17].y - lm[5].y;
    const knuckleDeg = Math.abs(Math.atan2(dyKn, dxKn) * 180 / Math.PI);

    // ── Fist: curled hand, knuckles horizontal (back of hand up) ──
    if (openness < 0.2 && curlCount >= 4 && knuckleDeg < 35) return 'fist';

    // ── Thumbs up: curled hand, knuckles vertical (back of hand sideways), thumb up ──
    const thumbUp = isThumbUp(lm) && fingers[0];
    const othersAllCurled = curled[1] && curled[2] && curled[3] && curled[4];
    if (thumbUp && othersAllCurled && knuckleDeg > 55) return 'thumbsUp';

    // ── OK gesture ──
    const thumbIdxClose = dist3d(lm[4], lm[8]) < 0.06;
    if (thumbIdxClose && fingers[2] && fingers[3] && fingers[4] && !fingers[1]) return 'ok';

    // ── Open palm ──
    if (openness > 0.75 && extCount >= 4) return 'openPalm';

    return 'none';
  }

  // ─────────────────────────────────────
  // Text content registry
  // ─────────────────────────────────────
  const TEXT_CONTENT = {
    aini:   { text: '爱你',             fontSize: 160 },
    xiexie: { text: '谢谢！',           fontSize: 140 },
    zhuni:  { text: '祝你每天都快乐',   fontSize: 72 },
  };

  // ─────────────────────────────────────
  // Enter / exit text mode
  // ─────────────────────────────────────
  function enterTextMode(mode) {
    if (state.textMode === mode) return;
    state.textMode = mode;
    state.textTransition = 0;
    state.textTimer = 0;
  }

  function exitTextMode() {
    state.textMode = null;
    state.textTransition = 1;
    state.textTimer = 0;
  }

  // ─────────────────────────────────────
  // Handle gesture transitions
  // ─────────────────────────────────────
  let lastGesture = 'none';
  let gestureLockUntil = 0;
  let lastOpennessForTarget = -1;
  let lastHandXForTarget = -1;
  let lastHandYForTarget = -1;

  function handleGesture(gesture, now) {
    if (now < gestureLockUntil && gesture !== 'none' && gesture !== 'fist' && gesture !== 'openPalm') {
      return; // debounce lock for discrete gestures
    }

    // ── Continuous: fist detection & sequence ──
    if (gesture === 'fist') {
      // Reset timer on fresh fist entry
      if (lastGesture !== 'fist') {
        state.fistStartTime = now;
        state.fistConfirmed = false;
      }
      const fistDuration = now - state.fistStartTime;
      if (fistDuration >= FIST_HOLD_MS && !state.fistConfirmed) {
        state.fistConfirmed = true;
        state.fistConfirmedTime = now;
        state.targetScale = 0.25;
        state.targetOffsetX = 0;
        state.targetOffsetY = 0;
      }
    } else if (state.fistConfirmed) {
      // Was holding fist, now released — check for valid fist→open sequence
      if (gesture === 'openPalm') {
        const elapsed = now - state.fistConfirmedTime;
        if (elapsed < TRANSITION_WINDOW_MS) {
          state.fistOpenCounter++;
          state.fistOpenLastTime = now;
          state.sequenceActive = true;

          if (state.fistOpenCounter === 1) {
            state.targetScale = 2.2;
            gestureLockUntil = now + 300;
          } else if (state.fistOpenCounter >= 2) {
            enterTextMode('zhuni');
            state.fistOpenCounter = 0;
            state.fistOpenLastTime = 0;
            gestureLockUntil = now + TEXT_DISPLAY_MS;
          }
        }
      }
      // Reset fist tracking when hand moves away from fist
      state.fistStartTime = 0;
      state.fistConfirmed = false;
    }

    // Reset scale to follow hand if not in special mode
    if (!state.textMode && !state.fistConfirmed) {
      state.targetScale = 0.3 + state.opennessSmoothed * 1.7;
    }

    // ── Discrete gestures ──
    if (gesture === 'vsign' && lastGesture !== 'vsign') {
      enterTextMode('aini');
      gestureLockUntil = now + 500;
    }
    if (gesture === 'thumbsUp' && lastGesture !== 'thumbsUp') {
      enterTextMode('xiexie');
      gestureLockUntil = now + 500;
    }
    if (gesture === 'ok' && lastGesture !== 'ok') {
      // Reset everything
      resetAll();
      gestureLockUntil = now + GESTURE_DEBOUNCE_MS;
    }

    // ── Release text gestures (only if not entering a new text mode) ──
    const willEnterNewText = (
      (gesture === 'vsign' && state.textMode !== 'aini') ||
      (gesture === 'thumbsUp' && state.textMode !== 'xiexie')
    );
    if (state.textMode === 'aini' && gesture !== 'vsign' && !willEnterNewText) {
      exitTextMode();
    }
    if (state.textMode === 'xiexie' && gesture !== 'thumbsUp' && !willEnterNewText) {
      exitTextMode();
    }

    lastGesture = gesture;
  }

  function resetAll() {
    exitTextMode();
    state.textMode = null;
    state.textTransition = 0;
    state.targetScale = 1;
    state.globalScale = 1;
    state.targetOffsetX = 0;
    state.targetOffsetY = 0;
    state.fistOpenCounter = 0;
    state.fistStartTime = 0;
    state.fistConfirmed = false;
    state.fistOpenLastTime = 0;
    state.sequenceActive = false;
  }

  // ─────────────────────────────────────
  // Flip detection
  // ─────────────────────────────────────
  function detectFlip(lm, handedness) {
    if (!lm || state.flipCooldown > 0) return false;

    // Use index MCP (5) vs pinky MCP (17) X difference, normalized by handedness
    let metric = handedness === 'Right'
      ? lm[5].x - lm[17].x
      : lm[17].x - lm[5].x;

    state.flipMetricHistory.push({ time: performance.now(), value: metric });
    // Keep last 20 frames
    if (state.flipMetricHistory.length > 20) state.flipMetricHistory.shift();
    if (state.flipMetricHistory.length < 5) return false;

    const recent = state.flipMetricHistory.slice(-5);
    const old = state.flipMetricHistory.slice(0, 5);
    const recentAvg = recent.reduce((s, v) => s + v.value, 0) / recent.length;
    const oldAvg = old.reduce((s, v) => s + v.value, 0) / old.length;

    const delta = Math.abs(recentAvg - oldAvg);
    const signChange = (recentAvg > 0.01) !== (oldAvg > 0.01);

    if (delta > 0.08 && signChange) {
      state.flipCooldown = 60; // ~1 second at 60fps
      return true;
    }
    return false;
  }

  // ─────────────────────────────────────
  // Update UI
  // ─────────────────────────────────────
  function updateUI(gestureName) {
    let label = '';
    const theme = THEMES[state.themeIndex % THEMES.length];
    const themeColor = theme.name === 'cyan' ? '#0ff' : theme.name === 'magenta' ? '#f0f' : '#fd0';

    if (state.textMode === 'aini') label = '对勾 ✅';
    else if (state.textMode === 'xiexie') label = '点赞 👍';
    else if (state.textMode === 'zhuni') label = '✨ 祝你每天都快乐 ✨';
    else if (state.fistOpenCounter >= 1 && !state.fistConfirmed && !state.textMode) label = '握拳→张开 ① ✓ 再来一次';
    else if (state.fistConfirmed) label = '握拳 ✊';
    else if (gestureName === 'openPalm') label = '五指张开 🖐';
    else if (gestureName === 'vsign') label = '对勾 ✌️';
    else if (gestureName === 'thumbsUp') label = '点赞 👍';
    else if (gestureName === 'ok') label = 'OK 重置';
    else if (!state.handDetected) label = '等待手势…';
    else label = '移动手掌 ✨';

    gestureLabel.textContent = label;
    gestureLabel.style.color = themeColor;
    gestureLabel.style.textShadow = `0 0 20px ${themeColor}, 0 0 40px ${themeColor}`;

    const scalePercent = Math.round(state.globalScale * 100);
    scaleIndicator.textContent = `缩放: ${scalePercent}%`;
    scaleIndicator.style.borderColor = themeColor;
    scaleIndicator.style.textShadow = `0 0 8px ${themeColor}`;
  }

  // ─────────────────────────────────────
  // Main update loop
  // ─────────────────────────────────────
  function update(now) {
    const dt = Math.min((now - state.lastTime) / 1000, 0.1);
    state.lastTime = now;

    // Decrease cooldowns
    if (state.flipCooldown > 0) state.flipCooldown--;
    if (gestureLockUntil > 0 && now > gestureLockUntil) gestureLockUntil = 0;

    // Sequence timeout
    if (state.fistOpenCounter > 0 && state.fistOpenLastTime > 0) {
      if (now - state.fistOpenLastTime > SEQUENCE_TIMEOUT_MS) {
        state.fistOpenCounter = 0;
        state.fistOpenLastTime = 0;
      }
    }

    // Smooth global scale & offset
    state.globalScale = lerp(state.globalScale, state.targetScale, 0.08);
    state.globalOffsetX = lerp(state.globalOffsetX, state.targetOffsetX, 0.1);
    state.globalOffsetY = lerp(state.globalOffsetY, state.targetOffsetY, 0.1);

    // Text mode timing — smooth exit for blessing text
    if (state.textMode === 'zhuni') {
      state.textTimer += dt;
      if (state.textTimer > TEXT_DISPLAY_MS / 1000) {
        exitTextMode();
        state.fistOpenCounter = 0;
        state.fistOpenLastTime = 0;
      }
    }

    // Text transition — fast enter (0.3s) for snappy feedback, smooth exit (0.5s)
    if (state.textMode && state.textTransition < 1) {
      state.textTransition = Math.min(1, state.textTransition + dt / 0.3);
    }
    if (!state.textMode && state.textTransition > 0) {
      state.textTransition = Math.max(0, state.textTransition - dt / 0.5);
    }

    // Breathing phase for text glow
    const breathPulse = 1 + Math.sin(now * 0.003) * 0.05;

    // Update particles — always floating, no text targets
    const cx = W / 2 + state.globalOffsetX;
    const cy = H / 2 + state.globalOffsetY;
    const scale = state.globalScale * breathPulse;

    for (const p of state.particles) {
      const floatX = Math.sin(now * 0.001 * p.freq + p.phase) * p.amp;
      const floatY = Math.cos(now * 0.0013 * p.freq + p.phase + 1) * p.amp;
      const tx = (p.baseX - W / 2) * scale + cx + floatX;
      const ty = (p.baseY - H / 2) * scale + cy + floatY;
      p.x = lerp(p.x, tx, 0.04);
      p.y = lerp(p.y, ty, 0.04);
      p.vx *= 0.95;
      p.vy *= 0.95;
    }
  }

  // ─────────────────────────────────────
  // Render
  // ─────────────────────────────────────
  function drawBackground() {
    // Deep space gradient
    const grad = ctx.createRadialGradient(W / 2, H / 2, 0, W / 2, H / 2, Math.max(W, H) * 0.7);
    grad.addColorStop(0, '#0a0a1a');
    grad.addColorStop(0.5, '#050515');
    grad.addColorStop(1, '#000005');
    ctx.fillStyle = grad;
    ctx.fillRect(0, 0, W, H);

    // Subtle star field (drawn once, could be cached)
    ctx.fillStyle = 'rgba(255,255,255,0.03)';
    const seed = 42;
    for (let i = 0; i < effectiveStarCount; i++) {
      const sx = ((i * 7919 + seed * 31) % W + W) % W;
      const sy = ((i * 6271 + seed * 73) % H + H) % H;
      const sr = 0.3 + ((i * 137) % 100) / 100 * 1.2;
      ctx.beginPath();
      ctx.arc(sx, sy, sr, 0, Math.PI * 2);
      ctx.fill();
    }
  }

  function drawParticles(now) {
    const inText = state.textMode && state.textTransition > 0.1;
    const bgDim = inText ? (1 - state.textTransition * 0.45) : 1;
    if (bgDim < 0.05) return;

    ctx.save();
    ctx.globalCompositeOperation = 'lighter';
    for (const p of state.particles) {
      const color = getThemeColor(p);
      const s = p.size * bgDim;
      // Glow
      const gg = ctx.createRadialGradient(p.x, p.y, 0, p.x, p.y, s * p.glowSize * glowScale);
      gg.addColorStop(0, color.hsla(color.a * 0.4));
      gg.addColorStop(0.5, color.hsla(color.a * 0.12));
      gg.addColorStop(1, 'rgba(0,0,0,0)');
      ctx.beginPath();
      ctx.arc(p.x, p.y, s * p.glowSize * glowScale, 0, Math.PI * 2);
      ctx.fillStyle = gg;
      ctx.fill();
      // Core
      const cg = ctx.createRadialGradient(p.x, p.y, 0, p.x, p.y, s);
      cg.addColorStop(0, `rgba(255,255,255,${0.85 * bgDim})`);
      cg.addColorStop(0.15, color.hsla(color.a * bgDim));
      cg.addColorStop(0.5, color.hsla(color.a * 0.4 * bgDim));
      cg.addColorStop(1, 'rgba(0,0,0,0)');
      ctx.beginPath();
      ctx.arc(p.x, p.y, s, 0, Math.PI * 2);
      ctx.fillStyle = cg;
      ctx.fill();
    }
    ctx.restore();
  }

  function drawIndicatorRing(now) {
    if (!state.handDetected) return;

    const cx = W / 2 + state.globalOffsetX;
    const cy = H / 2 + state.globalOffsetY;
    const r = state.globalScale * Math.min(W, H) * 0.35;
    const theme = THEMES[state.themeIndex % THEMES.length];
    const hueColor = theme.name === 'cyan' ? '0,255,220' : theme.name === 'magenta' ? '255,0,255' : '255,210,0';

    ctx.save();
    ctx.globalCompositeOperation = 'lighter';

    // Outer ring
    const pulse = 1 + Math.sin(now * 0.004) * 0.06;
    ctx.beginPath();
    ctx.arc(cx, cy, r * pulse, 0, Math.PI * 2);
    ctx.strokeStyle = `rgba(${hueColor},0.25)`;
    ctx.lineWidth = 2;
    ctx.shadowColor = `rgba(${hueColor},0.4)`;
    ctx.shadowBlur = 15;
    ctx.stroke();
    ctx.shadowBlur = 0;

    // Inner ring
    ctx.beginPath();
    ctx.arc(cx, cy, r * 0.7 * pulse, 0, Math.PI * 2);
    ctx.strokeStyle = `rgba(${hueColor},0.12)`;
    ctx.lineWidth = 1;
    ctx.setLineDash([10, 20]);
    ctx.stroke();
    ctx.setLineDash([]);

    // Center dot
    const dotGrad = ctx.createRadialGradient(cx, cy, 0, cx, cy, 6);
    dotGrad.addColorStop(0, `rgba(${hueColor},0.7)`);
    dotGrad.addColorStop(1, 'rgba(0,0,0,0)');
    ctx.beginPath();
    ctx.arc(cx, cy, 6, 0, Math.PI * 2);
    ctx.fillStyle = dotGrad;
    ctx.fill();

    ctx.restore();
  }

  function drawPreviewSkeleton() {
    if (!state.landmarksSmoothed) return;
    previewCtx.clearRect(0, 0, previewCanvas.width, previewCanvas.height);

    // Draw video frame (mirrored)
    previewCtx.save();
    previewCtx.translate(previewCanvas.width, 0);
    previewCtx.scale(-1, 1);
    try {
      previewCtx.drawImage(videoEl, 0, 0, previewCanvas.width, previewCanvas.height);
    } catch (e) { /* video not ready */ }
    previewCtx.restore();

    // Mirror landmarks for drawing
    const mirrored = state.landmarksSmoothed.map(l => ({
      x: (1 - l.x) * previewCanvas.width,
      y: l.y * previewCanvas.height,
    }));

    // Draw connections using MediaPipe drawing utils (with fallback)
    if (window.drawConnectors && window.HAND_CONNECTIONS) {
      window.drawConnectors(previewCtx, mirrored, window.HAND_CONNECTIONS, {
        color: '#00FFCC',
        lineWidth: 1.5,
      });
      window.drawLandmarks(previewCtx, mirrored, {
        color: '#FF00AA',
        lineWidth: 1,
        radius: 2.5,
      });
    } else {
      // Fallback: manual skeleton drawing
      drawSkeletonFallback(previewCtx, mirrored);
    }
  }

  function drawSkeletonFallback(ctx, lm) {
    const connections = [
      [0,1],[1,2],[2,3],[3,4],[0,5],[5,6],[6,7],[7,8],
      [5,9],[9,10],[10,11],[11,12],[9,13],[13,14],[14,15],[15,16],
      [13,17],[17,18],[18,19],[19,20],[0,17]
    ];
    ctx.strokeStyle = '#00FFCC';
    ctx.lineWidth = 1.5;
    ctx.globalAlpha = 0.8;
    connections.forEach(([a, b]) => {
      ctx.beginPath();
      ctx.moveTo(lm[a].x, lm[a].y);
      ctx.lineTo(lm[b].x, lm[b].y);
      ctx.stroke();
    });
    lm.forEach(p => {
      ctx.beginPath();
      ctx.arc(p.x, p.y, 2.5, 0, Math.PI * 2);
      ctx.fillStyle = '#FF00AA';
      ctx.fill();
    });
    ctx.globalAlpha = 1;
  }

  function render(now) {
    ctx.clearRect(0, 0, W, H);
    drawBackground();
    drawIndicatorRing(now);
    drawParticles(now);

    // Direct text rendering — crisp, clear, no particle approximation
    if (state.textMode && state.textTransition > 0.05) {
      drawTextDirect(state.textMode, state.textTransition);
    }

    drawPreviewSkeleton();
    updateUI(lastGesture);
  }

  // Render text directly with fillText — perfect clarity
  function drawTextDirect(mode, alpha) {
    const cfg = TEXT_CONTENT[mode];
    if (!cfg) return;
    const theme = THEMES[state.themeIndex % THEMES.length];
    const hue = theme.baseHue;

    ctx.save();
    ctx.textAlign = 'center';
    ctx.textBaseline = 'middle';
    const fontSize = Math.min(cfg.fontSize, W * 0.13);
    ctx.font = `bold ${fontSize}px "Microsoft YaHei", "PingFang SC", "Noto Sans SC", sans-serif`;

    // Outer glow (text-shadow equivalent)
    ctx.shadowColor = `hsla(${hue}, 100%, 70%, ${0.7 * alpha})`;
    ctx.shadowBlur = 18 * alpha * shadowScale;
    ctx.fillStyle = `hsla(${hue}, 100%, 85%, ${alpha})`;
    ctx.fillText(cfg.text, W / 2, H / 2);
    // Second pass for brighter glow
    ctx.shadowBlur = 8 * alpha * shadowScale;
    ctx.fillText(cfg.text, W / 2, H / 2);

    // Core text — pure white for max readability
    ctx.shadowBlur = 0;
    ctx.shadowColor = 'transparent';
    ctx.fillStyle = `rgba(255,255,255,${0.95 * alpha})`;
    ctx.fillText(cfg.text, W / 2, H / 2);

    ctx.restore();
  }

  // ─────────────────────────────────────
  // Animation loop
  // ─────────────────────────────────────
  function loop(now) {
    update(now);
    render(now);
    requestAnimationFrame(loop);
  }

  // ─────────────────────────────────────
  // MediaPipe Hands setup
  // ─────────────────────────────────────
  let handsInstance = null;

  function onHandResults(results) {
    if (results.multiHandLandmarks && results.multiHandLandmarks.length > 0) {
      const lm = results.multiHandLandmarks[0];
      state.landmarksRaw = lm;
      state.handedness = results.multiHandedness[0]?.label || null;
      state.handDetected = true;

      // Smoothing: maintain history
      state.landmarksHistory.push(lm);
      if (state.landmarksHistory.length > SMOOTHING_FRAMES) {
        state.landmarksHistory.shift();
      }

      // Compute smoothed landmarks
      const smoothed = [];
      const n = state.landmarksHistory.length;
      for (let i = 0; i < 21; i++) {
        let sx = 0, sy = 0, sz = 0;
        for (let j = 0; j < n; j++) {
          sx += state.landmarksHistory[j][i].x;
          sy += state.landmarksHistory[j][i].y;
          sz += (state.landmarksHistory[j][i].z || 0);
        }
        smoothed.push({ x: sx / n, y: sy / n, z: sz / n });
      }
      state.landmarksSmoothed = smoothed;

      // Openness
      const rawOpenness = calcOpenness(smoothed);
      state.openness = rawOpenness;
      state.opennessSmoothed = lerp(state.opennessSmoothed, rawOpenness, 0.3);

      // Hand center
      const hcx = smoothed[9].x;
      const hcy = smoothed[9].y;
      state.handCenterX = hcx;
      state.handCenterY = hcy;
      state.handCenterSmoothedX = lerp(state.handCenterSmoothedX, hcx, 0.25);
      state.handCenterSmoothedY = lerp(state.handCenterSmoothedY, hcy, 0.25);

      // Map hand position to particle offset (only update on significant change)
      const newOffsetX = (state.handCenterSmoothedX - 0.5) * W * 0.7;
      const newOffsetY = (state.handCenterSmoothedY - 0.5) * H * 0.3;
      if (Math.abs(newOffsetX - lastHandXForTarget) > W * 0.005 ||
          Math.abs(newOffsetY - lastHandYForTarget) > H * 0.005) {
        state.targetOffsetX = newOffsetX;
        state.targetOffsetY = newOffsetY;
        lastHandXForTarget = newOffsetX;
        lastHandYForTarget = newOffsetY;
      }

      // Update target scale based on openness (if not in special mode, with threshold)
      if (!state.textMode && !state.fistConfirmed) {
        const newScale = 0.3 + state.opennessSmoothed * 1.7;
        if (Math.abs(newScale - lastOpennessForTarget) > 0.02) {
          state.targetScale = newScale;
          lastOpennessForTarget = newScale;
        }
      }

      // Gesture detection
      const now = performance.now();
      const gesture = detectGestures(smoothed);
      handleGesture(gesture, now);

      // Flip detection
      if (state.flipCooldown <= 0 && detectFlip(smoothed, state.handedness)) {
        state.themeIndex = (state.themeIndex + 1) % THEMES.length;
        state.flipCooldown = 60;
      }
    } else {
      state.handDetected = false;
      state.landmarksRaw = null;
      state.landmarksSmoothed = null;
      state.landmarksHistory = [];
      state.opennessSmoothed = lerp(state.opennessSmoothed, 0.5, 0.05);
      if (!state.textMode) {
        state.targetScale = 1;
        state.targetOffsetX = 0;
        state.targetOffsetY = 0;
      }
    }
  }

  async function initMediaPipe() {
    const Hands = window.Hands;
    if (!Hands) {
      throw new Error('MediaPipe Hands not loaded');
    }

    handsInstance = new Hands({
      locateFile: (file) => `https://cdn.jsdelivr.net/npm/@mediapipe/hands/${file}`,
    });

    handsInstance.setOptions({
      maxNumHands: 1,
      modelComplexity: 1,
      minDetectionConfidence: 0.7,
      minTrackingConfidence: 0.5,
    });

    handsInstance.onResults(onHandResults);

    // Start camera
    // Try ideal constraints first, fall back to minimal on failure
    let stream;
    try {
      stream = await navigator.mediaDevices.getUserMedia({
        video: {
          width: { ideal: 480 },
          height: { ideal: 360 },
          facingMode: 'user',
          frameRate: { ideal: 30 },
        },
      });
    } catch (e) {
      // Mobile fallback: minimal constraints
      stream = await navigator.mediaDevices.getUserMedia({
        video: { facingMode: 'user' },
      });
    }
    videoEl.srcObject = stream;
    await videoEl.play();

    // Process frames
    async function processFrame() {
      if (handsInstance && videoEl.readyState >= 2) {
        await handsInstance.send({ image: videoEl });
      }
      requestAnimationFrame(() => processFrame());
    }
    processFrame();
  }

  // ─────────────────────────────────────
  // Guide close button
  // ─────────────────────────────────────
  guideCloseBtn.addEventListener('click', () => {
    guideBox.style.opacity = '0';
    setTimeout(() => { guideBox.style.display = 'none'; }, 800);
  });

  // Hide guide after 8 seconds
  setTimeout(() => {
    if (guideBox.style.display !== 'none') {
      guideBox.style.opacity = '0';
      setTimeout(() => { guideBox.style.display = 'none'; }, 800);
    }
  }, 10000);

  // ─────────────────────────────────────
  // Startup (model loads first, then user taps to start camera)
  // ─────────────────────────────────────
  const startBtn = document.getElementById('startBtn');

  async function startCamera() {
    startBtn.disabled = true;
    startBtn.textContent = '启动中…';
    loadingOverlay.querySelector('.text').textContent = '正在请求摄像头…';
    try {
      await initMediaPipe();
      loadingOverlay.style.opacity = '0';
      setTimeout(() => { loadingOverlay.style.display = 'none'; }, 500);
      requestAnimationFrame(loop);
    } catch (err) {
      console.error('Camera error:', err);
      startBtn.disabled = false;
      startBtn.textContent = '重试';
      const msg = err.name === 'NotAllowedError'
        ? '摄像头权限被拒绝，请在浏览器设置中允许后重试'
        : err.name === 'NotFoundError'
        ? '未检测到摄像头'
        : '摄像头启动失败，请检查权限后重试';
      loadingOverlay.querySelector('.text').textContent = msg;
      loadingOverlay.querySelector('.spinner').style.display = 'none';
    }
  }

  startBtn.addEventListener('click', startCamera);
  // Also support touch for mobile
  startBtn.addEventListener('touchend', (e) => { e.preventDefault(); startCamera(); });

  // Wait for MediaPipe scripts to load, then show start button
  function waitForMediaPipe() {
    return new Promise((resolve) => {
      const check = () => {
        if (window.Hands) {
          resolve();
        } else {
          setTimeout(check, 100);
        }
      };
      check();
    });
  }

  waitForMediaPipe().then(() => {
    loadingOverlay.querySelector('.text').textContent = '模型就绪，点击开始';
    loadingOverlay.querySelector('.spinner').style.display = 'none';
    startBtn.style.display = 'inline-block';
  }).catch((err) => {
    console.error('MediaPipe load error:', err);
    loadingOverlay.querySelector('.text').textContent =
      '模型加载失败，请检查网络连接后刷新页面';
    loadingOverlay.querySelector('.spinner').style.display = 'none';
  });
})();
</script>
</body>
</html>
